services:
  maildev:
    image: maildev/maildev
    ports:
      - "20250:1025"
      - "20800:1080"

  mariadb:
    image: mariadb:10.5.28
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: amped_bio
      MYSQL_USER: amped_user
      MYSQL_PASSWORD: amped_password
    ports:
      - "23306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./init-scripts:/docker-entrypoint-initdb.d

  adminer:
    image: adminer
    restart: always
    ports:
      - 28080:8080
    environment:
      ADMINER_DEFAULT_SERVER: mariadb
      ADMINER_DEFAULT_USERNAME: amped_user
      ADMINER_DEFAULT_PASSWORD: amped_password
    depends_on:
      - mariadb

  # S3Mock: Local S3 compatible service
  # - API endpoint: http://localhost:9090
  # - Web UI: http://localhost:9191
  # - Default bucket: amped-bio
  s3mock:
    image: adobe/s3mock
    ports:
      - "29090:9090" # S3 API endpoint
      - "29191:9191" # Web UI
    environment:
      - initialBuckets=amped-bio
      - root=/data
    volumes:
      - s3mock_data:/data

  # DragonflyDB: a Redis compatible in-memory store (drop-in for redis:7).
  # The server reaches it through the REDIS_* variables (port 26379).
  redis:
    image: ghcr.io/dragonflydb/dragonfly:v2.1.0
    # Dragonfly needs 256 MiB per thread; two threads keep it inside small dev VMs
    command: ["--proactor_threads=2", "--dir", "/data", "--dbfilename", "dump"]
    ulimits:
      memlock: -1
    ports:
      - "26379:6379"
    volumes:
      - redis_data:/data
    restart: always

volumes:
  mariadb_data:
  s3mock_data:
  redis_data:
