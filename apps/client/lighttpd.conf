# lighttpd configuration for the built React app
# The listening port is set by the container command from the PORT environment
# variable (see apps/client/Dockerfile)

server.modules = (
  "mod_rewrite",
  "mod_deflate"
)

server.document-root = "/var/www/localhost/htdocs"
server.pid-file      = "/run/lighttpd.pid"
server.username      = "lighttpd"
server.groupname     = "lighttpd"
server.port          = 80

index-file.names = ("index.html")

# Serve index.html for any path that is not an existing file so client-side
# routing for React Router works on deep links
url.rewrite-if-not-file = ( "^/(.*)$" => "/index.html" )

mimetype.assign = (
  ".html" => "text/html",
  ".js"   => "text/javascript",
  ".mjs"  => "text/javascript",
  ".css"  => "text/css",
  ".json" => "application/json",
  ".map"  => "application/json",
  ".txt"  => "text/plain",
  ".xml"  => "text/xml",
  ".svg"  => "image/svg+xml",
  ".png"  => "image/png",
  ".jpg"  => "image/jpeg",
  ".jpeg" => "image/jpeg",
  ".gif"  => "image/gif",
  ".webp" => "image/webp",
  ".avif" => "image/avif",
  ".ico"  => "image/x-icon",
  ".pdf"  => "application/pdf",
  ".woff" => "font/woff",
  ".woff2" => "font/woff2",
  ".ttf"  => "font/ttf",
  ".otf"  => "font/otf",
  ".eot"  => "application/vnd.ms-fontobject",
  ".wasm" => "application/wasm",
  ".mp4"  => "video/mp4",
  ".webm" => "video/webm",
  ".mp3"  => "audio/mpeg",
  ".zip"  => "application/zip",
  ""      => "application/octet-stream"
)

deflate.mimetypes = (
  "text/html",
  "text/plain",
  "text/css",
  "text/javascript",
  "application/json",
  "application/javascript",
  "text/xml",
  "application/xml",
  "image/svg+xml"
)
