# Signature updates. The container has no general internet: the Worker allows
# database.clamav.net only (allowedHosts). DNS update checks are off, so freshclam
# goes straight to the mirror over HTTPS.
DatabaseDirectory /var/lib/clamav
DatabaseOwner clamav
DatabaseMirror database.clamav.net
DNSDatabaseInfo no
ScriptedUpdates yes
Checks 1
ConnectTimeout 30
ReceiveTimeout 120
