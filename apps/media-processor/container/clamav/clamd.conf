# clamd for the media toolbox. Limits match CLAMSCAN_LIMITS in src/scan.mjs.
# A file over a limit, or an encrypted archive or document, raises a heuristic
# alert; the toolbox turns it into a failed item. Nothing unscanned is published.
LocalSocket /run/clamav/clamd.ctl
LocalSocketMode 666
FixStaleSocket yes
User clamav
Foreground yes
DatabaseDirectory /var/lib/clamav
SelfCheck 3600
ConcurrentDatabaseReload no
MaxThreads 2
ReadTimeout 600
CommandReadTimeout 30

ScanArchive yes
ScanPDF yes
ScanOLE2 yes
ScanHTML yes
ScanPE yes
ScanELF yes

MaxFileSize 600M
MaxScanSize 2000M
StreamMaxLength 600M
MaxRecursion 16
MaxFiles 20000
AlertExceedsMax yes
AlertEncryptedArchive yes
AlertEncryptedDoc yes
