name: Typecheck and Build

# Automatic triggers are disabled: GitHub Actions is blocked on this repository
# (the account is billing-locked), so every run is reported as failed before
# the job starts. Keeping only `workflow_dispatch` stops the red runs while the
# workflow definition stays intact for manual runs once billing is resolved.
on:
  workflow_dispatch:

concurrency:
  group: typecheck-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # End-to-end tests run in the Client Tests workflow; skip the Cypress binary here
      CYPRESS_INSTALL_BINARY: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          # Version comes from "packageManager" in package.json
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm run build:packages

      - name: Typecheck all apps
        run: pnpm run typecheck

      - name: Build all apps
        run: pnpm run build

      - name: Server unit tests
        # The two OAuth integration files need staging and a database; they run by hand (AGENTS.md, Testing)
        run: pnpm --filter @repo/server run test:unit

      - name: Media gateway Worker tests
        # Runs inside workerd with local R2, KV, Durable Object and Cache API bindings
        run: pnpm --filter @repo/media-gateway run test

      - name: Media processor Worker tests
        # Runs inside workerd with local R2 and queues; the toolbox is faked here
        run: pnpm --filter @repo/media-processor run test

      - name: Shared constants tests
        # Theme Engine v2 registry rules, legacy map and the no pixel change check (#28)
        run: pnpm --filter @repo/constants run test

      - name: Shared UI tests
        # Theme Engine v2 creator look, CreatorPage markup and the frame watchdog (#28)
        run: pnpm --filter @repo/ui run test

      - name: Compliance copy check
        run: pnpm run check:copy

  media-toolbox:
    # The processor's container code against the real tools: sharp, ffmpeg, ClamAV,
    # poppler, qpdf, unzip. Fixtures (EICAR, GPS PNG, renamed EXE, zip bomb, tagged
    # MP3, PDF with metadata, EPUB) are generated by the tests.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/media-processor/container
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg clamav poppler-utils qpdf libheif-examples unzip

      - name: Install and test
        run: npm ci && npm test
