# AmpedPay and future Amped.Bio contracts (Build Board #50, spec docs/features/ampedpay.md).
# Not a pnpm workspace package: there is no package.json, so pnpm and turbo skip this folder.
# Dependencies come from Soldeer: run `forge soldeer install` once, then `forge build` and `forge test`.

[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["dependencies"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
remappings = [
  "@openzeppelin/contracts/=dependencies/@openzeppelin-contracts-5.1.0/",
  "@openzeppelin/contracts-upgradeable/=dependencies/@openzeppelin-contracts-upgradeable-5.1.0/",
  "forge-std/=dependencies/forge-std-1.9.4/src/",
]

[fuzz]
runs = 1000

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
base = "${BASE_RPC_URL}"

[etherscan]
base_sepolia = { key = "${BASESCAN_API_KEY}", chain = 84532 }
base = { key = "${BASESCAN_API_KEY}", chain = 8453 }

[dependencies]
"@openzeppelin-contracts" = "5.1.0"
"@openzeppelin-contracts-upgradeable" = "5.1.0"
forge-std = "1.9.4"

[soldeer]
remappings_generate = false
remappings_regenerate = false
